name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    # ubuntu-latest (26.04) has no Python 3.9 for setup-python.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Standard library only: the converter and its vendored hierarchy code
      # have no dependencies to install.
      - run: python -m unittest discover -s tests -v
